<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Formulario de Encuesta</h1>
    <form id="encuestaForm">
      <label>Gustos Musicales:</label>
      <input type="text" placeholder="Ej: Rock, Pop..." required>
      
      <label>Gustos Deportivos:</label>
      <input type="text" placeholder="Ej: Fútbol, Natación..." required>

      <label>Estudios:</label>
      <input type="text" placeholder="Ej: Secundario, Universidad..." required>

      <label>Laborales:</label>
      <input type="text" placeholder="Ej: Empleado, Freelance..." required>

      <label>Otros:</label>
      <textarea placeholder="Otros comentarios..."></textarea>

      <button type="submit">Enviar Encuesta</button>
    </form>

    <div class="buttons">
      <a href="index.html" class="btn">Inicio</a>
      <a href="datos.html" class="btn">Ir a Datos Personales</a>
    </div>

    <img src="https://images.pexels.com/photos/3184309/pexels-photo-3184309.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Encuesta Imagen" class="form-img">
  </div>
</body>
</html>
