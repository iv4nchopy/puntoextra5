<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>Formulario de Encuesta</h1>

    <!-- Formulario de encuesta -->
    <form id="encuestaForm">
      <input type="text" id="music" placeholder="Gustos Musicales" required>
      <input type="text" id="sports" placeholder="Gustos Deportivos" required>
      <input type="text" id="studies" placeholder="Estudios" required>
      <input type="text" id="work" placeholder="Laborales" required>
      <textarea id="others" placeholder="Otros comentarios"></textarea>
      <input type="email" id="email" placeholder="Correo del usuario" required>
      <button type="submit">Enviar Encuesta</button>
    </form>

    <!-- Botones de navegación -->
    <div class="buttons">
      <a href="index.html" class="btn">Inicio</a>
      <a href="datos.html" class="btn">Ir a Datos Personales</a>
    </div>

    <!-- Mensaje de estado -->
    <p id="status-message-encuesta"></p>

    <!-- Imagen decorativa -->
    <img src="https://images.pexels.com/photos/3184309/pexels-photo-3184309.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Encuesta Imagen" class="form-img">
  </div>

  <!-- JS funcional con EmailJS -->
  <script>
    // Inicializa EmailJS
    emailjs.init("Mij2hxi74IOrpJ8Q");

    // Formulario Encuesta
    const encuestaForm = document.getElementById('encuestaForm');
    if (encuestaForm) {
      encuestaForm.addEventListener('submit', function(e) {
        e.preventDefault();

        emailjs.send("service_a3697qc", "template_q33r6qn", {
          music: document.getElementById('music').value,
          sports: document.getElementById('sports').value,
          studies: document.getElementById('studies').value,
          work: document.getElementById('work').value,
          others: document.getElementById('others').value,
          userEmail: document.getElementById('email').value // solo para mostrar en el correo
        })
        .then(() => {
          document.getElementById('status-message-encuesta').innerText = "¡Encuesta enviada con éxito!";
          encuestaForm.reset();
        })
        .catch(err => {
          console.error("Error EmailJS (Encuesta):", err);
          document.getElementById('status-message-encuesta').innerText = "Error al enviar la encuesta";
        });
      });
    }
  </script>
</body>
</html>
